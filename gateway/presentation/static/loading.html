<!DOCTYPE html>
<html>
<head>
    <title>ComfyUI Gateway</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
        }
        .loader {
            border: 4px solid #222;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        h2 {
            font-weight: 500;
            margin: 10px 0;
        }
        p {
            color: #888;
            font-size: 14px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        var lang = navigator.language || navigator.userLanguage;
        var isZh = lang.startsWith("zh");
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("title-h2").textContent = isZh
                ? "ComfyUI 正在启动中..."
                : "ComfyUI is starting...";
            document.getElementById("desc-p").textContent = isZh
                ? "代理网关已就绪。您可以照常提交任务，本页面将在服务就绪后自动载入。"
                : "Gateway proxy is ready. You can submit tasks as usual. This page will auto-reload when the service is ready.";
        });
        setTimeout(function () {
            window.location.reload();
        }, 2000);
    </script>
</head>
<body>
    <div class="loader"></div>
    <h2 id="title-h2">ComfyUI is starting...</h2>
    <p id="desc-p">Gateway proxy is ready. You can submit tasks as usual. This page will auto-reload when the service is ready.</p>
</body>
</html>
